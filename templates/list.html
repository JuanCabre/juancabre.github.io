<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publication list · @@NAME@@</title>
<meta name="description" content="The complete publication list of @@NAME@@, as of @@SNAPSHOT_LABEL@@.">
<link rel="canonical" href="@@SITE_URL@@publications/list/">
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: 'Libertinus Serif'; font-weight: 400; font-display: block; src: url('../../assets/fonts/libertinus-serif-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Libertinus Serif'; font-weight: 400; font-display: block; src: url('../../assets/fonts/libertinus-serif-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Libertinus Serif'; font-weight: 400; font-style: italic; font-display: block; src: url('../../assets/fonts/libertinus-serif-latin-400-italic.woff2') format('woff2'); }
@font-face { font-family: 'Libertinus Serif'; font-weight: 600; font-display: block; src: url('../../assets/fonts/libertinus-serif-latin-ext-600-normal.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Libertinus Serif'; font-weight: 600; font-display: block; src: url('../../assets/fonts/libertinus-serif-latin-600-normal.woff2') format('woff2'); }
:root { --ink: #111; --muted: #555; --line: #bbb; --link: #104281; --bg: #fff; }
@page { size: A4; margin: 20mm 19mm 20mm; @bottom-left { content: "@@NAME@@ · Publication list"; font: italic 8.5pt 'Libertinus Serif', serif; color: #555; } @bottom-right { content: counter(page) " / " counter(pages); font: 8.5pt 'Libertinus Serif', serif; color: #555; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 11pt/1.42 'Libertinus Serif', 'Iowan Old Style', Palatino, Georgia, serif; }
main { max-width: 172mm; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.screen-bar { display: flex; gap: 18px; flex-wrap: wrap; font-size: 10.5pt; margin-bottom: 26px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
a { color: var(--link); }
h1 { font-size: 21pt; font-weight: 400; font-variant: small-caps; letter-spacing: .04em; margin: 0; line-height: 1.15; }
.sub { font-style: italic; margin: 3px 0 12px; }
.summary { font-size: 9.5pt; color: var(--muted); margin: 0 0 4px; }
h2 { font-size: 12.5pt; font-weight: 400; font-variant: small-caps; letter-spacing: .05em; border-bottom: .6pt solid var(--ink); padding-bottom: 2px; margin: 20px 0 8px; break-after: avoid; }
ol { margin: 0; padding: 0; list-style: none; counter-reset: entry; }
li { counter-increment: entry; position: relative; padding-left: 2.3em; margin: 0 0 5.5px; font-size: 10pt; line-height: 1.36; break-inside: avoid; overflow-wrap: anywhere; }
li::before { content: counter(entry) "."; position: absolute; left: 0; width: 1.8em; text-align: right; color: var(--muted); }
li strong { font-weight: 600; }
li .t { font-style: italic; }
li a { color: inherit; text-decoration: none; }
@media screen { li a { color: var(--link); } }
@media print {
  .screen-bar { display: none; }
  main { max-width: none; padding: 0; }
  body { background: #fff; }
}
</style>
</head>
<body>
<main>
<nav class="screen-bar" aria-label="Site">
  <a href="../">← Publications</a>
  @@PDF_LINK@@
  <a href="../../assets/data/publications.bib">BibTeX file</a>
</nav>
<h1>Publication List</h1>
<p class="sub">@@NAME@@</p>
<p class="summary">@@SUMMARY@@</p>
<p class="summary">As of @@SNAPSHOT_LABEL@@ · @@SITE_URL@@</p>
@@LIST@@
</main>
<script data-goatcounter="https://quitapesares.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
